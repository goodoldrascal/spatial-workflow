[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial-workflow"
version = "0.1.0"
description = "A reproducible Xenium spatial-transcriptomics workflow."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anndata",
  "h5py",
  "numpy",
  "pandas",
  "pyarrow",
  "pyyaml",
  "scipy",
]

[project.optional-dependencies]
cellcharter = [
  "cellcharter==0.3.7",
  "scanpy==1.12",
  "scvi-tools==1.4.2",
  "squidpy==1.8.1",
]
nncomp = [
  "spatial-nncomp @ git+https://github.com/goodoldrascal/spatial-nncomp.git@b7515429fc2da29928194998d6027361676d7951",
]
cnmf = [
  "cnmf==1.7.0",
  "scanpy==1.12",
]
liana = [
  "liana==1.7.1",
  "scanpy==1.12",
]
notebooks = [
  "jupyterlab",
  "matplotlib",
  "plotly",
  "rpy2",
  "seaborn",
  "statsmodels",
]
test = [
  "nbformat",
  "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spatial_workflow = ["resources/*.R"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
